  <div class="hint">Scroll to open<i></i></div>

  <div class="loader"><span>Opening the album</span><i></i></div>

  <script src="./config.js"></script>
  <script src="./script.js"></script>

  <!-- frame-scroll bridge: added so this album can play at the end of the
       scroll animation (frame-scroll/js/album-section.js). When embedded:
       the page around it drives the album's progress with its own scroll,
       wheel input and the index links go to that page, and the cover's four
       corners are reported so the filmed book can be lined up with it.
       Nothing else changes; opened on its own the album works as before. -->
  <script>
  (function () {
    if (window.parent === window || !window.__album) return;
    var root = document.documentElement;
    root.classList.add('fs-embedded');
    root.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    function post(m) { try { window.parent.postMessage(m, '*'); } catch (e) {} }

    // invisible markers on the cover's outer corners
    var face = document.querySelector('#book .mover.cover .face.front');
    var marks = [];
    if (face) {
      [[0, 0], [1, 0], [1, 1], [0, 1]].forEach(function (c) {
        var i = document.createElement('i');
        i.setAttribute('aria-hidden', 'true');
        i.style.cssText = 'position:absolute;width:0;height:0;pointer-events:none;left:' + (c[0] * 100) + '%;top:' + (c[1] * 100) + '%;';
        face.appendChild(i); marks.push(i);
      });
    }
    function coverQuad() {
      return marks.map(function (m) { var r = m.getBoundingClientRect(); return [r.left, r.top]; });
    }

    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || ev.source !== window.parent || d.album == null) return;
      if (d.album === 'progress') window.__album.set(d.p);
      else if (d.album === 'measure') post({ album: 'cover', quad: coverQuad(), w: innerWidth, h: innerHeight });
    });

    // scrolling over the album scrolls the page around it
    window.addEventListener('wheel', function (e) {
      e.preventDefault();
      var dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
      post({ album: 'wheel', dy: dy });
    }, { passive: false, capture: true });
    window.addEventListener('keydown', function (e) {
      var k = { ArrowDown: 60, ArrowUp: -60, PageDown: innerHeight * 0.9, PageUp: -innerHeight * 0.9, ' ': innerHeight * 0.9 }[e.key];
      if (k == null) return;
      e.preventDefault(); post({ album: 'wheel', dy: e.shiftKey && e.key === ' ' ? -k : k });
    }, true);
    // index links jump within the page around it
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('.index-rail a');
      if (!a) return;
      e.preventDefault(); e.stopImmediatePropagation();
      post({ album: 'goto', p: +a.dataset.p });
    }, true);
    post({ album: 'ready' });
  })();
  </script>
</body>
</html>
