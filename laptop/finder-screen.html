<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sachin — Projects</title>
<meta name="description" content="Explore Sachin's UI/UX case studies through a macOS-style Finder window.">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --win-radius:12px;
  --sidebar:rgba(234,232,240,.78);
  --sidebar-ink:#3b3b40;
  --sidebar-muted:#9a99a2;
  --pane:#ffffff;
  --ink:#1d1d1f;
  --muted:#86868b;
  --hair:#e6e6e9;
  --hover:rgba(0,0,0,.055);
  --select:#0a63d8;
  --tint:#2d7ff0;
  --red:#ff5f57;--red-edge:#e0443e;
  --yellow:#febc2e;--yellow-edge:#dea123;
  --green:#28c840;--green-edge:#1aab29;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);background:#2c2a4a;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
:focus-visible{outline:3px solid rgba(10,99,216,.55);outline-offset:2px;border-radius:8px}

/* ============================================================
   DESKTOP + WALLPAPER
   ============================================================ */
.desktop{position:fixed;inset:0;overflow:hidden}
.wallpaper{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ============================================================
   MENU BAR (decorative)
   ============================================================ */
.menubar{position:absolute;z-index:5;top:0;left:0;right:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:rgba(40,36,66,.28);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);color:#fff;font-size:13px;pointer-events:none;text-shadow:0 1px 1px rgba(0,0,0,.08)}
.menubar .left,.menubar .right{display:flex;align-items:center;gap:18px}
.menubar .mono{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;background:#fff;color:#2c2a4a;font-size:10.5px;font-weight:800;letter-spacing:-.02em}
.menubar b{font-weight:700}
.menubar svg{display:block;opacity:.95}
.menubar .clock{font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ============================================================
   FINDER WINDOW
   ============================================================ */
.stage{position:absolute;inset:28px 0 92px;display:grid;place-items:center;padding:16px;pointer-events:none}
.finder{pointer-events:auto;width:min(900px,100%);height:min(570px,100%);display:grid;grid-template-columns:192px 1fr;border-radius:var(--win-radius);overflow:hidden;
  background:var(--pane);
  box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.18) inset,0 30px 80px rgba(10,6,30,.42),0 10px 24px rgba(10,6,30,.22);
  transform-origin:50% 60%;will-change:transform,opacity}
.finder.is-closed{visibility:hidden;pointer-events:none}

/* sidebar */
.sidebar{background:var(--sidebar);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-right:1px solid rgba(0,0,0,.07);padding:16px 10px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.lights{display:flex;gap:8px;padding:2px 8px 0;height:20px;align-items:center}
.light{width:12px;height:12px;border-radius:50%;position:relative;display:grid;place-items:center;flex:none}
.light.red{background:var(--red);box-shadow:inset 0 0 0 .5px var(--red-edge);cursor:default}
.light.yellow{background:var(--yellow);box-shadow:inset 0 0 0 .5px var(--yellow-edge)}
.light.green{background:var(--green);box-shadow:inset 0 0 0 .5px var(--green-edge)}
.light.red svg{opacity:0;transition:opacity .15s}
.lights:hover .light.red svg,.light.red:focus-visible svg{opacity:1}
.light.red:active{filter:brightness(.82)}
.side-group{display:flex;flex-direction:column;gap:1px}
.side-label{font-size:11px;font-weight:700;color:var(--sidebar-muted);padding:0 10px 5px}
.side-item{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--sidebar-ink);text-align:left;width:100%;cursor:default;transition:background-color .15s}
.side-item svg{flex:none;color:var(--tint)}
button.side-item:hover{background:rgba(0,0,0,.05)}
.side-item.active{background:rgba(0,0,0,.09)}
.side-item.static{pointer-events:none}
.side-item.static svg{color:#8e8d96}

/* main pane */
.main{display:grid;grid-template-rows:52px 1fr 28px;min-width:0;background:var(--pane)}
.toolbar{display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-bottom:1px solid var(--hair)}
.nav-btn{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:#56565b;transition:background-color .15s,opacity .15s;cursor:default}
.nav-btn:hover:not(:disabled){background:var(--hover)}
.nav-btn:disabled{opacity:.28}
.title{font-size:15px;font-weight:700;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.spacer{flex:1}
.tool-deco{display:flex;align-items:center;gap:14px;color:#8a8a90;margin-right:10px}
.tool-deco .seg{display:flex;border-radius:6px;overflow:hidden}
.tool-deco .seg span{width:28px;height:24px;display:grid;place-items:center}
.tool-deco .seg span.on{background:rgba(0,0,0,.07);color:#3a3a3f;border-radius:6px}
.search{width:168px;height:28px;border-radius:7px;background:#f1f1f3;display:flex;align-items:center;gap:6px;padding:0 9px;color:#a1a1a6;font-size:13px}

.content{position:relative;overflow:auto;padding:22px 26px 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 8px;align-content:start}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px 8px;border-radius:10px;cursor:default;text-align:center;outline:none}
.item .ico{width:96px;height:80px;display:grid;place-items:center;border-radius:10px;transition:background-color .18s,transform .25s var(--ease-out)}
.item .ico svg{width:78px;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.10));transition:transform .3s var(--ease-out)}
.item .ico svg.file{width:58px}
.item:hover .ico{background:var(--hover)}
.item:hover .ico svg{transform:translateY(-2px)}
.item:active .ico svg{transform:scale(.96)}
.item .name{font-size:12.5px;line-height:1.25;padding:1px 6px;border-radius:4px;max-width:112px;word-break:break-word;transition:background-color .12s,color .12s}
.item .sub{font-size:11px;color:var(--muted);margin-top:-3px}
.item.selected .ico,.item:focus-visible .ico{background:rgba(0,0,0,.09)}
.item.selected .name,.item:focus-visible .name{background:var(--select);color:#fff}
.item.selected .sub{color:#4b84d6}

.pathbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-top:1px solid #ededf0;font-size:11.5px;color:#6e6e73;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:4px;overflow:hidden}
.crumb{display:flex;align-items:center;gap:5px;padding:2px 5px;border-radius:4px;cursor:default}
button.crumb:hover{background:var(--hover)}
.crumb svg{color:var(--tint)}
.crumb-sep{color:#b5b5ba}

/* ============================================================
   DOCK (hover only — not clickable)
   ============================================================ */
.dock-wrap{position:absolute;z-index:6;left:0;right:0;bottom:8px;display:flex;justify-content:center;pointer-events:none}
.dock{pointer-events:auto;height:70px;display:flex;align-items:flex-end;gap:6px;padding:0 8px 8px;border-radius:20px;
  background:rgba(255,255,255,.22);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);
  box-shadow:0 0 0 .5px rgba(255,255,255,.35) inset,0 0 0 .5px rgba(0,0,0,.18),0 10px 30px rgba(10,6,30,.25);cursor:default}
.dock-item{--s:1;position:relative;width:calc(52px * var(--s));height:calc(52px * var(--s));flex:none;transition:width .16s var(--ease-out),height .16s var(--ease-out)}
.dock.tracking .dock-item{transition:width .06s linear,height .06s linear}
.dock-item svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));pointer-events:none}
.dock-item .tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:4px 10px;border-radius:6px;background:rgba(40,40,46,.86);color:#fff;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.dock-item .tip:after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(40,40,46,.86)}
.dock-item:hover .tip{opacity:1;transform:translate(-50%,0)}
.dock-item .dot{position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.9);opacity:0;transition:opacity .3s}
.dock-item.running .dot{opacity:1}
.dock-sep{width:1px;align-self:stretch;margin:10px 4px 2px;background:rgba(255,255,255,.4)}

/* ============================================================
   FULL-SCREEN PROJECT VIEWER
   ============================================================ */
.viewer{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:44px 1fr;background:#f6f6f8;will-change:clip-path}
.v-bar{position:relative;display:flex;align-items:center;gap:14px;padding:0 14px;background:rgba(246,246,248,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #dcdce0}
.v-bar .lights{padding:0 4px 0 2px}
.v-back{display:flex;align-items:center;gap:4px;height:28px;padding:0 12px 0 8px;border-radius:7px;font-size:13px;font-weight:600;color:#3a3a3f;background:rgba(0,0,0,.05);cursor:default;transition:background-color .15s,transform .15s}
.v-back:hover{background:rgba(0,0,0,.09)}
.v-back:active{transform:scale(.97)}
.v-title{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:#3a3a3f;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.v-hint{margin-left:auto;font-size:11.5px;color:#9a9aa0;display:flex;align-items:center;gap:6px}
.v-hint kbd{font-family:var(--font);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid #d2d2d7;background:#fff;color:#6e6e73}
.v-body{position:relative;overflow:hidden;background:#fff}
.v-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s ease}
.v-body iframe.ready{opacity:1}
.loader{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;color:#86868b;font-size:13px;transition:opacity .3s}
.loader.done{opacity:0;pointer-events:none}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid #e2e2e6;border-top-color:#8e8e93;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(180deg,#fbfbfd,#f2f2f5)}
.placeholder svg{width:88px;height:auto;margin-bottom:8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}
.placeholder h2{margin:0;font-size:24px;letter-spacing:-.02em}
.placeholder p{margin:0;max-width:380px;color:#6e6e73;font-size:14px;line-height:1.55}
.placeholder .tag{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a1a1a6}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:760px){
  .finder{grid-template-columns:1fr}
  .sidebar{display:none}
  .toolbar .lights{display:flex}
  .tool-deco,.search{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .item .ico{width:84px;height:72px}
  .item .ico svg{width:66px}.item .ico svg.file{width:44px}
  .menubar .hide-sm{display:none}
  .dock-item{width:calc(40px * var(--s));height:calc(40px * var(--s))}
  .dock{height:56px;gap:4px;padding-bottom:7px;border-radius:16px}
  .dock .hide-sm{display:none}
  .stage{bottom:76px}
  .v-hint{display:none}
}
@media (min-width:761px){.toolbar .lights{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

<div class="desktop">

  </svg>

  <!-- Menu bar (decorative) -->
  <header class="menubar" aria-hidden="true">

      <span class="mono">S</span>

      <span class="hide-sm">File</span><span class="hide-sm">Edit</span><span class="hide-sm">View</span><span class="hide-sm">Go</span><span class="hide-sm">Window</span><span class="hide-sm">Help</span>

  <!-- Finder window -->

      <div class="main">
        <div class="toolbar">
          <div class="lights">
            <button class="light red" data-close-finder aria-label="Close window"><svg width="6" height="6" viewBox="0 0 6 6" stroke="#7a1a14" stroke-width="1.2" stroke-linecap="round"><path d="M1 1l4 4M5 1 1 5"/></svg></button>

/* ---------- Finder rendering ---------- */
function itemsAt(loc){
  if (loc === 'root') {
    return Object.entries(CONFIG.folders).map(([key, f]) => ({ name: f.title, folder: key, glyph: f.glyph, sub: f.items.length + ' items' }));
  }
  return CONFIG.folders[loc].items;
}

function render(){
  const loc = here();
  const items = itemsAt(loc);
  grid.innerHTML = '';

    const el = document.createElement('button');
    el.className = 'item';
    el.setAttribute('role', 'listitem');
    el.setAttribute('aria-label', item.folder ? `Open ${item.name} folder` : `Open ${item.name}`);
    el.innerHTML = `<span class="ico">${iconFor(item)}</span><span class="name">${item.name}</span>${item.sub ? `<span class="sub">${item.sub}</span>` : ''}`;

  countEl.textContent = items.length + (items.length === 1 ? ' item' : ' items');

  btnFwd.disabled = idx === hist.length - 1;
  document.querySelectorAll('.side-item[data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === loc));
  const folderIco = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 1.5H13a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12z"/></svg>';
  crumbsEl.innerHTML = loc === 'root'
    ? `<span class="crumb">${folderIco}Projects</span>`
    : `<button class="crumb" data-go="root">${folderIco}Projects</button><span class="crumb-sep">›</span><span class="crumb">${folderIco}${titleOf(loc)}</span>`;
  content.scrollTop = 0;
}

function activate(item, el){
  if (busy || viewerOpen) return;
  grid.querySelectorAll('.item.selected').forEach(n => n.classList.remove('selected'));
  el.classList.add('selected');
  setTimeout(() => {
    if (item.folder) navigate(item.folder);
    else openViewer(item, el);
  }, dur(110));
}

function transition(dir){
  busy = true;
  const out = grid.animate(
    [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-14 * dir}px)` }],
    { duration: dur(130), easing: 'ease-in', fill: 'forwards' });
  out.onfinish = () => {
    render();
    out.cancel();
    const inn = grid.animate(
      [{ opacity: 0, transform: `translateX(${14 * dir}px)` }, { opacity: 1, transform: 'none' }],
      { duration: dur(240), easing: 'cubic-bezier(.2,.8,.2,1)' });
    inn.onfinish = () => { busy = false; };
  };
}
function navigate(loc){
  if (busy || viewerOpen || loc === here()) return;
  hist = hist.slice(0, idx + 1); hist.push(loc); idx++;
  transition(loc === 'root' ? -1 : 1);
}
function goBack(){ if (!busy && !viewerOpen && idx > 0){ idx--; transition(-1); } }
function goFwd(){ if (!busy && !viewerOpen && idx < hist.length - 1){ idx++; transition(1); } }

btnBack.addEventListener('click', goBack);
btnFwd.addEventListener('click', goFwd);
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go && finder.contains(go)) navigate(go.dataset.go);
});

/* ---------- Finder open / close / auto-reopen ---------- */
function openFinder(){
  clearTimeout(reopenTimer);

  setRunning(true);

}

/* ---------- Embedded case studies (all-in-one / review builds only) ----------
   All-in-one: <script class="embedded-case" data-file="..."> holds a base64 copy.
   Review build: window.CASE_CHUNKS maps a file name to script files that each add
   one piece of the page to window.__caseParts[file].
   In both cases the page is written straight into the frame (srcdoc), which works
   in strict viewers that block blob: or file links. Otherwise the file is loaded
   by its name (linked build). */
const pageCache = {};
function addBase(html){
  // keep in-page links like #research inside the case study
  return html.replace(/<head([^>]*)>/i, '<head$1><base href="about:srcdoc">');
}
function loadScript(url){
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = url; el.onload = res; el.onerror = () => rej(new Error('Could not load ' + url));
    document.head.appendChild(el);
  });
}
async function embeddedPage(file){
  if (file in pageCache) return pageCache[file];
  const el = document.querySelector(`script.embedded-case[data-file="${file}"]`);
  if (el) {
    const bin = atob(el.textContent.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return (pageCache[file] = addBase(new TextDecoder('utf-8').decode(bytes)));
  }
  const chunks = window.CASE_CHUNKS && window.CASE_CHUNKS[file];
  if (chunks) {
    window.__caseParts = window.__caseParts || {};
    window.__caseParts[file] = [];
    for (const url of chunks) await loadScript(url);
    return (pageCache[file] = addBase(window.__caseParts[file].join('')));
  }
  return null;
}

/* ---------- Full-screen viewer ---------- */
function rectInset(el){
  const W = innerWidth, H = innerHeight;
  if (el && el.isConnected) {
    const r = el.getBoundingClientRect();
    if (r.width) return `inset(${r.top}px ${W - r.right}px ${H - r.bottom}px ${r.left}px round 14px)`;
  }
  return `inset(${H * .42}px ${W * .42}px ${H * .42}px ${W * .42}px round 14px)`;
}
function openViewer(item, el){
  if (viewerOpen) return;
  viewerOpen = true;
  lastIcon = el.querySelector('.ico') || el;
  const folderTitle = titleOf(here());
  vTitle.textContent = item.type === 'code' ? `Project ${item.name}` : `${item.name} — ${item.kind || 'Project'}`;
  vBackLabel.textContent = folderTitle;
  vBody.innerHTML = '';

  let frame = null, loader = null;
  if (item.src) {
    loader = document.createElement('div');
    loader.className = 'loader';
    loader.innerHTML = `<div class="spinner"></div><div>Opening ${item.name}…</div>`;
    vBody.appendChild(loader);
    frame = document.createElement('iframe');
    frame.title = item.name;
    frame.addEventListener('load', () => {
      if (!frame.dataset.requested) return;   // ignore the initial empty-frame load
      frame.classList.add('ready'); loader.classList.add('done');
    });
    vBody.appendChild(frame);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.innerHTML = `${iconFor(item).replace('class="file"', '')}
      <h2>${item.type === 'code' ? 'Project ' + item.name : item.name}</h2>
      <p>This project is being prepared. The full ${item.type === 'code' ? 'project' : 'case study'} will open here soon.</p>
      <div class="tag">Link coming soon</div>`;
    vBody.appendChild(ph);
  }

  viewer.hidden = false;
  const a = viewer.animate([
    { clipPath: rectInset(lastIcon), opacity: 1 },
    { clipPath: 'inset(0px 0px 0px 0px round 0px)', opacity: 1 }
  ], { duration: dur(520), easing: 'cubic-bezier(.2,.8,.2,1)' });
  a.onfinish = () => {
    if (frame) {                       // load after the zoom so the animation stays smooth
      embeddedPage(item.src).then(embedded => {
        if (!frame.isConnected) return;                 // closed while loading
        frame.dataset.requested = '1';
        if (embedded !== null) frame.srcdoc = embedded; // all-in-one / review build
        else frame.src = item.src;                      // linked build
      }).catch(() => {
        if (loader) loader.querySelector('div:last-child').textContent = 'This project could not be loaded.';
      });
    }
    $('#vBack').focus({ preventScroll: true });
  };
}
function closeViewer(){
  if (!viewerOpen || viewer.dataset.closing) return;
  viewer.dataset.closing = '1';
  const a = viewer.animate([
    { clipPath: 'inset(0px 0px 0px 0px round 0px)', opacity: 1 },
    { clipPath: rectInset(lastIcon), opacity: 0 }
  ], { duration: dur(420), easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
  a.onfinish = () => {
    viewer.hidden = true;
    a.cancel();
    vBody.innerHTML = '';          // unload the project page to free memory
    delete viewer.dataset.closing;
    viewerOpen = false;
    grid.querySelectorAll('.item.selected').forEach(n => n.classList.remove('selected'));
    const btn = lastIcon && lastIcon.closest('.item');
    if (btn) btn.focus({ preventScroll: true });
  };
}
$('#vBack').addEventListener('click', closeViewer);
$('#vClose').addEventListener('click', closeViewer);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && viewerOpen) { e.preventDefault(); closeViewer(); return; }
  if (!finderOpen || viewerOpen) return;
  if ((e.metaKey || e.ctrlKey) && e.key === '[') { e.preventDefault(); goBack(); }
  if ((e.metaKey || e.ctrlKey) && e.key === ']') { e.preventDefault(); goFwd(); }
  if (e.key === 'Backspace' && !e.target.closest('input,textarea')) { e.preventDefault(); goBack(); }

  { label: 'Settings', svg: `<rect width="64" height="64" rx="14" fill="url(#dSettings)"/><g transform="translate(32 32)" fill="#5b5b63"><circle r="13"/><g >${Array.from({length:8},(_,i)=>`<rect x="-3.2" y="-19" width="6.4" height="8" rx="1.6" transform="rotate(${i*45})"/>`).join('')}</g></g><circle cx="32" cy="32" r="6" fill="#c4c4ca"/>` },
  { sep: true },
  { label: 'Downloads', cls: 'hide-sm', svg: `<rect width="64" height="64" rx="14" fill="url(#dDownloads)"/><path d="M32 16v24M22 31l10 10 10-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 46h28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>` },
  { label: 'Trash', svg: `<rect x="12" y="10" width="40" height="5" rx="2.5" fill="#d6d6dc"/><path d="M15 18h34l-3 36a4 4 0 0 1-4 3.6H22a4 4 0 0 1-4-3.6z" fill="url(#dTrash)" stroke="#b8b8c0"/><path d="M25 24v26M32 24v26M39 24v26" stroke="#b0b0b8" stroke-width="2" stroke-linecap="round"/>` }
];
const dock = $('#dock');
DOCK.forEach(d => {
  if (d.sep) { const s = document.createElement('div'); s.className = 'dock-sep'; dock.appendChild(s); return; }
  const el = document.createElement('div');
  el.className = 'dock-item' + (d.cls ? ' ' + d.cls : '');
  if (d.id) el.id = 'dock-' + d.id;
  el.innerHTML = `<svg viewBox="0 0 64 64">${d.svg}</svg><span class="tip">${d.label}</span><span class="dot"></span>`;
  dock.appendChild(el);
});
const dockItems = [...dock.querySelectorAll('.dock-item')];
const MAG = 1.5, RANGE = 150;
let raf = 0, mx = null;
function magnify(){
  raf = 0;
  dockItems.forEach(it => {
    if (mx === null) { it.style.setProperty('--s', 1); return; }
    const r = it.getBoundingClientRect();
    const d = Math.abs(mx - (r.left + r.width / 2));
    const t = Math.min(d / RANGE, 1);
    it.style.setProperty('--s', (1 + (MAG - 1) * Math.cos(t * Math.PI / 2)).toFixed(3));
  });
}
if (!reduce && matchMedia('(hover:hover)').matches) {
  dock.addEventListener('mousemove', e => { mx = e.clientX; dock.classList.add('tracking'); if (!raf) raf = requestAnimationFrame(magnify); });
  dock.addEventListener('mouseleave', () => { mx = null; dock.classList.remove('tracking'); if (!raf) raf = requestAnimationFrame(magnify); });
}
// The dock is decorative: swallow presses so nothing reacts to clicks.
['mousedown','click','dblclick','contextmenu','dragstart'].forEach(t => dock.addEventListener(t, e => e.preventDefault()));

const filesDock = $('#dock-files');
function setRunning(on){ filesDock.classList.toggle('running', on); }
function bounceFiles(){
  if (reduce) return;
  filesDock.querySelector('svg').animate([
    { transform: 'translateY(0)' }, { transform: 'translateY(-16px)', offset: .3 },
    { transform: 'translateY(0)', offset: .6 }, { transform: 'translateY(-6px)', offset: .8 }, { transform: 'translateY(0)' }
  ], { duration: 700, easing: 'ease-out' });
}

/* ---------- Menu bar clock ---------- */
function tick(){
  const d = new Date();
  const day = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  $('#clock').textContent = `${day}  ${time}`;
}
tick(); setInterval(tick, 15000);

/* ---------- Boot ---------- */
setTimeout(openFinder, dur(450));
</script>
<script>
/* ---------- Frame-scroll bridge (added for the laptop integration) ----------
   Tells the page around this one (the scroll animation) about wheel and
   arrow / page-key input, and whether this window is on its landing page
   (Projects, with no project open). Changes nothing on screen. */
(function () {
  if (window.parent === window) return;
  // Scrolling inside this page must never spill over into the page around it.
  document.documentElement.style.overscrollBehavior = 'none';
  document.body && (document.body.style.overscrollBehavior = 'none');
  function landing() {
    try {
      var atRoot = (typeof here === 'function') ? here() === 'root' : true;
      var open = (typeof viewerOpen !== 'undefined') && viewerOpen;
      return atRoot && !open;
    } catch (e) { return false; }
  }
  addEventListener('wheel', function (e) {
    var dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1);
    parent.postMessage({ frameScroll: 'wheel', dy: dy, landing: landing() }, '*');
  }, { passive: true, capture: true });
  addEventListener('keydown', function (e) {
    var dir = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }[e.key];
    if (!dir || (e.target.closest && e.target.closest('input,textarea'))) return;
    parent.postMessage({ frameScroll: 'key', dir: dir, landing: landing() }, '*');
  }, true);
})();
</script>
